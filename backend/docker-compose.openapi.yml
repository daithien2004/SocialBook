services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: socialbook
      POSTGRES_USER: socialbook
      POSTGRES_PASSWORD: socialbook_dev
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U socialbook -d socialbook']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2.4-alpine
    ports:
      - '6379:6379'

  redis-queue:
    image: redis:7.2.4-alpine
    ports:
      - '6380:6379'
