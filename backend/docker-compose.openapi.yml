services:
  mongo:
    image: mongo:7
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2.4-alpine
    ports:
      - '6379:6379'

  redis-queue:
    image: redis:7.2.4-alpine
    ports:
      - '6380:6379'
