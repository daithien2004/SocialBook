worker_rlimit_nofile 65535;
events {
    worker_connections 16384;
}

upstream backend {
    least_conn;
    server backend1:5000;
    server backend2:5000;
}

upstream frontend {
    server frontend:3000;
}

log_format upstream_log '$remote_addr - [$time_local] '
                        '"$request" $status '
                        'upstream: $upstream_addr';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name socialbook.io.vn www.socialbook.io.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name socialbook.io.vn www.socialbook.io.vn;

    ssl_certificate     /etc/letsencrypt/live/socialbook.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/socialbook.io.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/access.log upstream_log;

    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-XSS-Protection         "1; mode=block"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript
               application/json application/javascript application/x-javascript
               application/xml image/svg+xml;

    client_max_body_size 50M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    location ~ ^/api/auth/(?:google|github)(?:/callback)?/?$ {
        proxy_pass http://frontend;
    }

    location /api/auth/ {
        proxy_pass http://backend;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /docs {
        proxy_pass http://backend;
    }

    location /queues {
        # Mục 20: IP Whitelist cho Bull-board
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        # deny all; # Bỏ comment deny all trên production khi đã xác định được IP của admin
        
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://frontend;
    }
}