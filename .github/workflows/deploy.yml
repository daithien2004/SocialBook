name: Deploy Dev Branch

on:
  push:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend - Install & Lint & Test
        run: |
          cd backend
          npm ci
          npm run lint
          npm run test:unit

      - name: Setup Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - Install & Lint & Build
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: daithien/socialbook-be:dev
          cache-from: type=registry,ref=daithien/socialbook-be:cache
          cache-to: type=registry,ref=daithien/socialbook-be:cache,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: daithien/socialbook-fe:dev
          build-args: |
            NEXT_PUBLIC_NEST_API_URL=/api
            NEXT_PUBLIC_SOCKET_URL=/
          cache-from: type=registry,ref=daithien/socialbook-fe:cache
          cache-to: type=registry,ref=daithien/socialbook-fe:cache,mode=max

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd ~/SocialBook

            echo "Pull latest images..."
            docker compose pull

            echo "Restart containers..."
            docker compose up -d --remove-orphans

            echo "Deploy completed!"
