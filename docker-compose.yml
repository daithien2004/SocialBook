
x-backend-common: &backend-common
  image: daithien/socialbook-be:dev
  restart: unless-stopped
  expose:
    - '5000'
  env_file:
    - backend.env
  depends_on:
    - mongo
    - redis
    - chroma

services:
  nginx:
    image: nginx:alpine
    container_name: socialbook-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
      - frontend

  backend1:
    <<: *backend-common
    container_name: socialbook-backend1

  backend2:
    <<: *backend-common
    container_name: socialbook-backend2

  frontend:
    image: daithien/socialbook-fe:dev
    container_name: socialbook-frontend
    restart: unless-stopped
    expose:
      - '3000'
    env_file:
      - frontend.env
    depends_on:
      - backend1
      - backend2

  mongo:
    image: mongo:7
    container_name: socialbook-mongo
    restart: unless-stopped
    expose:
      - '27017'
    volumes:
      - mongo_data:/data/db
    env_file:
      - mongo.env

  redis:
    image: redis:7-alpine
    container_name: socialbook-redis
    restart: unless-stopped
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  chroma:
    image: chromadb/chroma:0.6.3
    container_name: socialbook-chroma
    restart: unless-stopped
    expose:
      - '8000'
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

volumes:
  mongo_data:
  redis_data:
  chroma_data:
